name: VRP inert policy probe
on:
  workflow_dispatch:
  repository_dispatch:
    types: [vrp_policy_probe]
  workflow_call:
permissions: {}
jobs:
  inert:
    runs-on: ubuntu-latest
    env:
      PROTECTED_POLICY_REPO_MARKER: ${{ secrets.PROTECTED_POLICY_REPO_MARKER }}
    steps:
      - name: Assert exact inherited repository secret is available
        shell: bash
        run: |
          actual="$(printf '%s' "$PROTECTED_POLICY_REPO_MARKER" | sha256sum | awk '{print $1}')"
          test "$actual" = "d4499f6d5edc69d1cb165e8f11c46eb7071e4dd55435c3369ba11388d6a70ec6"
      - name: Emit harmless marker
        run: echo "ACTIONS_POLICY_PROBE_20261003 event=${{ github.event_name }}"
