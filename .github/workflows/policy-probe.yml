name: VRP dummy environment canary
on:
  workflow_dispatch:
  workflow_call:
permissions: {}
jobs:
  canary:
    environment: dummy-impact
    runs-on: ubuntu-latest
    steps:
      - name: Assert dummy environment secret is present
        shell: bash
        env:
          CALLEE_SENTINEL: ${{ secrets.CALLEE_SENTINEL }}
          EXPECTED_SHA256: ae5ac6731902614efa59cdbcf1cc52970adc3cda012899f2fd5699472aa0e7ee
        run: |
          set -euo pipefail
          test -n "$CALLEE_SENTINEL"
          actual="$(printf '%s' "$CALLEE_SENTINEL" | sha256sum | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA256"
          echo 'DUMMY_CANARY_MATCH=true'
