name: VRP inert policy probe
on:
  workflow_dispatch:
  repository_dispatch:
    types: [vrp_policy_probe]
  workflow_call:
permissions:
  contents: read
  id-token: write
jobs:
  inert:
    runs-on: ubuntu-latest
    steps:
      - name: Assert OIDC token carries protected reusable-workflow identity
        shell: bash
        env:
          EXPECTED_JOB_WORKFLOW_REF: basementdwellingtesting/advisory-comments-authz11-103559/.github/workflows/policy-probe.yml@refs/heads/main
          EXPECTED_AUDIENCE: vrp-policy-probe-20261003
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          curl --fail --silent --show-error             -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${EXPECTED_AUDIENCE}"             > "$response_file"
          python3 - "$response_file" <<'PY'
import base64
import json
import os
import sys

with open(sys.argv[1], "r", encoding="utf-8") as fh:
    encoded = json.load(fh)["value"]
payload_part = encoded.split(".")[1]
payload_part += "=" * (-len(payload_part) % 4)
claims = json.loads(base64.urlsafe_b64decode(payload_part))
assert claims["aud"] == os.environ["EXPECTED_AUDIENCE"]
assert claims["job_workflow_ref"] == os.environ["EXPECTED_JOB_WORKFLOW_REF"]
assert claims["job_workflow_sha"] == os.environ["GITHUB_SHA"]
assert claims["actor"] in {"basementdwellingtesting", "atticdwellingtesting"}
PY
      - name: Emit harmless marker
        run: echo "ACTIONS_POLICY_PROBE_20261003 event=${{ github.event_name }}"
